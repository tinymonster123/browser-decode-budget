<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <title>WebGPU dispatch cost microbenchmark</title>
    <style>
      body {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        margin: 2rem;
        line-height: 1.5;
      }
      #status {
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>WebGPU dispatch cost</h1>
    <div id="status">booting…</div>
    <script type="module">
      const status = (text) => {
        document.querySelector('#status').textContent = text;
        console.log(text);
        window.__reportProgress?.(text);
      };

      // One recurrence for every mode, so the only difference between the
      // independent and dependent measurements is how the dispatches are
      // encoded. The recurrence is order-sensitive: a serialized chain of N
      // dispatches always lands on lcg(0, N), while lost or reordered updates
      // do not. One integer multiply-add per dispatch is negligible next to a
      // pass boundary, and it turns the dependent run into a verifiable chain.
      // One definition of the recurrence, used by both the shader and the
      // expected-value check below. They must not drift apart.
      const LCG_A = 1664525;
      const LCG_C = 1013904223;

      const SHADER = /* wgsl */ `
        @group(0) @binding(0) var<storage, read_write> out: array<u32>;

        @compute @workgroup_size(1)
        fn main() {
          out[0] = out[0] * ${LCG_A}u + ${LCG_C}u;
        }
      `;

      function lcg(value, steps) {
        let current = value >>> 0;
        for (let i = 0; i < steps; i++) {
          current = (Math.imul(current, LCG_A) + LCG_C) >>> 0;
        }
        return current;
      }

      function median(values) {
        const clean = values.filter((v) => Number.isFinite(v));
        if (!clean.length) return null;
        const sorted = [...clean].sort((a, b) => a - b);
        const mid = Math.floor(sorted.length / 2);
        return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
      }

      // External GPU work only ever adds time, never removes it, so the fast
      // tail is the least contaminated estimate of the real cost. The strict
      // minimum is still vulnerable to a rare anomalously fast sample (a clock
      // boost, or a run the driver overlapped), so the decision channel is the
      // 5th percentile: clean samples, with the extreme few rejected at both
      // ends. The median and the minimum stay in the ledger next to it so the
      // interference can be seen.
      function percentile(values, p) {
        const clean = values.filter((v) => Number.isFinite(v)).sort((a, b) => a - b);
        if (!clean.length) return null;
        return clean[Math.min(clean.length - 1, Math.floor(p * (clean.length - 1)))];
      }

      function minimum(values) {
        const clean = values.filter((v) => Number.isFinite(v));
        return clean.length ? Math.min(...clean) : null;
      }

      // Flip the sweep order every repeat so neither sweep systematically
      // inherits the state left by the other.
      function sweepOrder(repeat, sweeps) {
        return repeat % 2 === 1
          ? Array.from({ length: sweeps }, (_, i) => sweeps - 1 - i)
          : Array.from({ length: sweeps }, (_, i) => i);
      }

      async function setup() {
        const adapter = await navigator.gpu.requestAdapter({
          powerPreference: 'high-performance',
        });
        if (!adapter) throw new Error('no WebGPU adapter');
        const info = adapter.info ?? adapter.adapterInfo ?? null;
        const timestampQuery = adapter.features?.has?.('timestamp-query') === true;
        const device = await adapter.requestDevice({
          ...(timestampQuery ? { requiredFeatures: ['timestamp-query'] } : {}),
          // The default storage binding limit is 128 MiB; a bandwidth plateau
          // needs buffers larger than that to rule out cache residency.
          requiredLimits: {
            maxStorageBufferBindingSize: adapter.limits.maxStorageBufferBindingSize,
            maxBufferSize: adapter.limits.maxBufferSize,
          },
        });
        const module = device.createShaderModule({ code: SHADER });
        const pipeline = device.createComputePipeline({
          layout: 'auto',
          compute: { module, entryPoint: 'main' },
        });
        const buffer = device.createBuffer({
          size: 4,
          usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST,
        });
        const bindGroupLayout = pipeline.getBindGroupLayout(0);
        const bindGroup = device.createBindGroup({
          layout: bindGroupLayout,
          entries: [{ binding: 0, resource: { buffer } }],
        });
        return {
          device,
          pipeline,
          bindGroup,
          bindGroupLayout,
          buffer,
          info,
          timestampQuery,
        };
      }

      // One dispatch per pass, each pass reading and writing the same element.
      // WebGPU makes an earlier pass's write visible to the next pass, so the
      // GPU cannot overlap these dispatches. `n-pass` keeps the historical
      // encoding unchanged; `dependent` adds the value verification below.
      function encodePassPerDispatch({ count, device, pipeline, bindGroup }) {
        const enc = device.createCommandEncoder();
        for (let i = 0; i < count; i++) {
          const pass = enc.beginComputePass();
          pass.setPipeline(pipeline);
          pass.setBindGroup(0, bindGroup);
          pass.dispatchWorkgroups(1);
          pass.end();
        }
        device.queue.submit([enc.finish()]);
        return 1;
      }

      // mode:
      //   one-pass   -> N dispatches inside a single compute pass, one submit
      //   n-pass     -> N compute passes in one encoder, one submit
      //   dependent  -> same encoding as n-pass, verified as a serial chain
      //   n-submit   -> N encoders, N submits
      function encode({ mode, count, device, pipeline, bindGroup, buffer }) {
        const t0 = performance.now();
        let submits = 0;

        if (mode === 'one-pass') {
          const enc = device.createCommandEncoder();
          const pass = enc.beginComputePass();
          pass.setPipeline(pipeline);
          pass.setBindGroup(0, bindGroup);
          for (let i = 0; i < count; i++) pass.dispatchWorkgroups(1);
          pass.end();
          device.queue.submit([enc.finish()]);
          submits = 1;
        } else if (mode === 'n-pass' || mode === 'dependent') {
          submits = encodePassPerDispatch({ count, device, pipeline, bindGroup });
        } else if (mode === 'n-submit') {
          for (let i = 0; i < count; i++) {
            const enc = device.createCommandEncoder();
            const pass = enc.beginComputePass();
            pass.setPipeline(pipeline);
            pass.setBindGroup(0, bindGroup);
            pass.dispatchWorkgroups(1);
            pass.end();
            device.queue.submit([enc.finish()]);
            submits += 1;
          }
        } else if (mode === 'ort-like') {
          // ORT WebGPU's per-node shape: rebuild the bind group, push uniform
          // data, bind, dispatch — all inside the pass.
          const enc = device.createCommandEncoder();
          const pass = enc.beginComputePass();
          pass.setPipeline(pipeline);
          for (let i = 0; i < count; i++) {
            const bg = device.createBindGroup({
              layout: pipeline.getBindGroupLayout(0),
              entries: [{ binding: 0, resource: { buffer } }],
            });
            device.queue.writeBuffer(buffer, 0, new Uint32Array([i]));
            pass.setBindGroup(0, bg);
            pass.dispatchWorkgroups(1);
          }
          pass.end();
          device.queue.submit([enc.finish()]);
          submits = 1;
        } else {
          throw new Error(`unknown mode ${mode}`);
        }

        const cpuMs = performance.now() - t0;
        return { cpuMs, submits };
      }

      function summarize({ mode, count, samples }) {
        return {
          mode,
          count,
          samples,
          wallMs: median(samples.map((s) => s.wallMs)),
          cpuMs: median(samples.map((s) => s.cpuMs)),
          gpuMs: median(samples.map((s) => s.gpuMs)),
          minWallMs: minimum(samples.map((s) => s.wallMs)),
          minGpuMs: minimum(samples.map((s) => s.gpuMs)),
          p05WallMs: percentile(samples.map((s) => s.wallMs), 0.05),
          p05GpuMs: percentile(samples.map((s) => s.gpuMs), 0.05),
        };
      }

      async function measure({ device, pipeline, bindGroup, buffer, mode, count, repeats }) {
        const samples = [];
        for (let i = 0; i < repeats; i++) {
          const encodeStart = performance.now();
          const { cpuMs, submits } = encode({
            mode,
            count,
            device,
            pipeline,
            bindGroup,
            buffer,
          });
          const submittedAt = performance.now();
          await device.queue.onSubmittedWorkDone();
          const doneAt = performance.now();
          samples.push({
            cpuMs,
            submitMs: submittedAt - encodeStart,
            wallMs: doneAt - encodeStart,
            gpuMs: doneAt - submittedAt,
            submits,
          });
        }
        return summarize({ mode, count, samples });
      }

      async function readU32(device, buffer) {
        const staging = device.createBuffer({
          size: 4,
          usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST,
        });
        const enc = device.createCommandEncoder();
        enc.copyBufferToBuffer(buffer, 0, staging, 0, 4);
        device.queue.submit([enc.finish()]);
        await staging.mapAsync(GPUMapMode.READ);
        const value = new Uint32Array(staging.getMappedRange())[0];
        staging.unmap();
        staging.destroy();
        return value;
      }

      async function resetU32(device, buffer) {
        device.queue.writeBuffer(buffer, 0, new Uint32Array([0]));
        await device.queue.onSubmittedWorkDone();
      }

      async function createBindGroupCost({ device, pipeline, bindGroupLayout, buffer, repeats }) {
        // Same shape as ORT's per-kernel bind group, repeated to get its µs cost.
        const count = 1000;
        const samples = [];
        for (let r = 0; r < repeats; r++) {
          const t0 = performance.now();
          for (let i = 0; i < count; i++) {
            device.createBindGroup({
              layout: bindGroupLayout,
              entries: [{ binding: 0, resource: { buffer } }],
            });
          }
          samples.push((performance.now() - t0) / count);
        }
        return { count, usPerCall: median(samples) * 1000, samples };
      }

      // ---------------------------------------------------------------
      // Bandwidth probe (Gate 6 #4)
      // ---------------------------------------------------------------
      // One read-only pass over a buffer. The loaded value feeds a sentinel
      // comparison that can only be true for one value, so the read cannot be
      // removed and the write traffic stays negligible.
      const BANDWIDTH_WORKGROUP = 256;
      const BANDWIDTH_SHADER = /* wgsl */ `
        @group(0) @binding(0) var<storage, read> data: array<u32>;
        @group(0) @binding(1) var<storage, read_write> sink: array<u32>;

        @compute @workgroup_size(${BANDWIDTH_WORKGROUP})
        fn main(
          @builtin(global_invocation_id) gid: vec3<u32>,
          @builtin(num_workgroups) groups: vec3<u32>,
        ) {
          let stride = ${BANDWIDTH_WORKGROUP}u * groups.x;
          var i = gid.x;
          while (i < arrayLength(&data)) {
            let v = data[i];
            if (v == 0xFFFFFFFFu) { sink[0] = v; }
            i = i + stride;
          }
        }
      `;

      async function runBandwidthPass({
        device,
        pipeline,
        bindGroup,
        workgroups,
        querySet,
        resolveBuffer,
        readBuffer,
      }) {
        const enc = device.createCommandEncoder();
        const pass = enc.beginComputePass({
          timestampWrites: {
            querySet,
            beginningOfPassWriteIndex: 0,
            endOfPassWriteIndex: 1,
          },
        });
        pass.setPipeline(pipeline);
        pass.setBindGroup(0, bindGroup);
        pass.dispatchWorkgroups(workgroups);
        pass.end();
        enc.resolveQuerySet(querySet, 0, 2, resolveBuffer, 0);
        enc.copyBufferToBuffer(resolveBuffer, 0, readBuffer, 0, 16);
        device.queue.submit([enc.finish()]);

        await readBuffer.mapAsync(GPUMapMode.READ, 0, 16);
        const view = new BigInt64Array(readBuffer.getMappedRange(0, 16));
        const ns = Number(view[1] - view[0]);
        readBuffer.unmap();
        return ns;
      }

      function summarizeBandwidth({ bytes, samples }) {
        const ns = samples.map((sample) => sample.ns);
        const gbpsOf = (value) => (value > 0 ? bytes / value : null);
        const p05Ns = percentile(ns, 0.05);
        const medianNs = median(ns);
        const minNs = minimum(ns);
        return {
          bytes,
          samples,
          p05Ns,
          medianNs,
          minNs,
          p05Gbps: gbpsOf(p05Ns),
          medianGbps: gbpsOf(medianNs),
          minGbps: gbpsOf(minNs),
        };
      }

      window.__bandwidth = async ({
        sizesMb = [4, 8, 16, 32, 64, 128, 256],
        repeats = 30,
        sweeps = 2,
      } = {}) => {
        const result = {
          info: null,
          timestampQuery: false,
          rows: [],
          error: null,
          stack: null,
        };
        try {
          const { device, info, timestampQuery } = await setup();
          result.info = info
            ? {
                vendor: info.vendor,
                architecture: info.architecture,
                device: info.device,
                description: info.description,
              }
            : null;
          result.timestampQuery = timestampQuery;

          if (!timestampQuery) {
            throw new Error(
              'timestamp-query is not available; refusing to measure bandwidth',
            );
          }

          const module = device.createShaderModule({ code: BANDWIDTH_SHADER });
          const compilation = await module.getCompilationInfo?.();
          const shaderErrors =
            compilation?.messages?.filter((message) => message.type === 'error') ?? [];
          if (shaderErrors.length) {
            throw new Error(
              `bandwidth shader: ${shaderErrors.map((m) => m.message).join('; ')}`,
            );
          }
          const pipeline = device.createComputePipeline({
            layout: 'auto',
            compute: { module, entryPoint: 'main' },
          });
          const layout = pipeline.getBindGroupLayout(0);

          const sizes = sizesMb.map((mb) => mb * 1024 * 1024);
          const resources = new Map();
          for (const bytes of sizes) {
            const data = device.createBuffer({
              size: bytes,
              usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
            });
            const sink = device.createBuffer({
              size: 4,
              usage:
                GPUBufferUsage.STORAGE |
                GPUBufferUsage.COPY_SRC |
                GPUBufferUsage.COPY_DST,
            });
            const bindGroup = device.createBindGroup({
              layout,
              entries: [
                { binding: 0, resource: { buffer: data } },
                { binding: 1, resource: { buffer: sink } },
              ],
            });
            const workgroups = Math.min(
              65535,
              Math.ceil(bytes / 4 / BANDWIDTH_WORKGROUP),
            );
            resources.set(bytes, { data, sink, bindGroup, workgroups });
          }

          const querySet = device.createQuerySet({ type: 'timestamp', count: 2 });
          const resolveBuffer = device.createBuffer({
            size: 16,
            usage: GPUBufferUsage.QUERY_RESOLVE | GPUBufferUsage.COPY_SRC,
          });
          const readBuffer = device.createBuffer({
            size: 16,
            usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ,
          });

          const largest = sizes[sizes.length - 1];
          const largestResource = resources.get(largest);

          // Steady-state clock before any sample is recorded.
          const warmUntil = performance.now() + 500;
          while (performance.now() < warmUntil) {
            await runBandwidthPass({
              device,
              pipeline,
              querySet,
              resolveBuffer,
              readBuffer,
              ...largestResource,
            });
          }

          const samples = new Map();
          for (let repeat = 0; repeat < repeats; repeat++) {
            const order = sweepOrder(repeat, sweeps);
            for (const sweep of order) {
              for (const bytes of sizes) {
                status(
                  `bandwidth repeat ${repeat}/${repeats - 1} sweep ` +
                    `${sweep}/${sweeps - 1} ${bytes / 1024 / 1024} MB…`,
                );
                const ns = await runBandwidthPass({
                  device,
                  pipeline,
                  querySet,
                  resolveBuffer,
                  readBuffer,
                  ...resources.get(bytes),
                });
                const key = `${sweep}:${bytes}`;
                if (!samples.has(key)) samples.set(key, []);
                samples.get(key).push({ ns, gbps: bytes / ns });
              }
            }
          }

          for (let sweep = 0; sweep < sweeps; sweep++) {
            for (const bytes of sizes) {
              result.rows.push({
                ...summarizeBandwidth({
                  bytes,
                  samples: samples.get(`${sweep}:${bytes}`) ?? [],
                }),
                sweep,
              });
            }
          }

          for (const resource of resources.values()) {
            resource.data.destroy();
            resource.sink.destroy();
          }
          resolveBuffer.destroy();
          readBuffer.destroy();
          querySet.destroy?.();
        } catch (error) {
          result.error = String(error);
          result.stack = error?.stack ?? null;
        }
        status(result.error ? `error: ${result.error}` : 'done');
        return result;
      };

      window.__microbench = async ({
        counts = [0, 1000, 2000, 4000, 8000],
        modes = ['one-pass', 'n-pass', 'dependent'],
        repeats = 60,
        sweeps = 2,
      } = {}) => {
        const result = {
          info: null,
          rows: [],
          chain: [],
          bindGroup: null,
          error: null,
          stack: null,
        };
        try {
          const { device, pipeline, bindGroup, bindGroupLayout, buffer, info } = await setup();
          result.info = info
            ? {
                vendor: info.vendor,
                architecture: info.architecture,
                device: info.device,
                description: info.description,
              }
            : null;

          // Bring the GPU to a steady clock before any sample is recorded.
          // A short warm-up leaves the clock ramping during the first counts,
          // which makes a small count look more expensive per dispatch than a
          // large one. One second of continuous work is discarded; it exists
          // to move the power state, not to contribute numbers.
          const warmUntil = performance.now() + 1000;
          let warmFlip = 0;
          while (performance.now() < warmUntil) {
            await measure({
              device,
              pipeline,
              bindGroup,
              buffer,
              mode: warmFlip++ % 2 === 0 ? 'one-pass' : 'dependent',
              count: 20000,
              repeats: 1,
            });
          }
          await device.queue.onSubmittedWorkDone();

          // Repeat-major, then sweep, then count. Each repeat is one complete
          // sweep, so the two slope points at 4000 and 8000 are sampled
          // seconds apart rather than tens of seconds apart, and a quiet
          // window of GPU time contributes to both. The sweep order flips
          // every repeat so neither sweep systematically inherits the state
          // left by the other.
          for (const mode of modes) {
            const samples = new Map();
            for (let repeat = 0; repeat < repeats; repeat++) {
              const order = sweepOrder(repeat, sweeps);
              for (const sweep of order) {
                for (const count of counts) {
                  status(
                    `repeat ${repeat}/${repeats - 1} sweep ${sweep}/${sweeps - 1} ` +
                      `${mode} count=${count}…`,
                  );
                  if (mode === 'dependent') await resetU32(device, buffer);
                  const sample = await measure({
                    device,
                    pipeline,
                    bindGroup,
                    buffer,
                    mode,
                    count,
                    repeats: 1,
                  });
                  const key = `${sweep}:${count}`;
                  if (!samples.has(key)) samples.set(key, []);
                  samples.get(key).push(sample.samples[0]);
                  if (mode === 'dependent') {
                    const actual = await readU32(device, buffer);
                    const expected = lcg(0, count);
                    result.chain.push({
                      sweep,
                      count,
                      repeat,
                      expected,
                      actual,
                      ok: actual === expected,
                    });
                  }
                }
              }
            }
            for (let sweep = 0; sweep < sweeps; sweep++) {
              for (const count of counts) {
                result.rows.push({
                  ...summarize({
                    mode,
                    count,
                    samples: samples.get(`${sweep}:${count}`) ?? [],
                  }),
                  sweep,
                });
              }
            }
          }

          result.bindGroup = await createBindGroupCost({
            device,
            pipeline,
            bindGroupLayout,
            buffer,
            repeats,
          });
        } catch (error) {
          result.error = String(error);
          result.stack = error?.stack ?? null;
        }
        status(result.error ? `error: ${result.error}` : 'done');
        return result;
      };

      window.__ready = true;
      status('ready');
    </script>
  </body>
</html>
