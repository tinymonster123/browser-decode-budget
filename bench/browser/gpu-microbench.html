<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <title>WebGPU dispatch cost microbenchmark</title>
    <style>
      body {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        margin: 2rem;
        line-height: 1.5;
      }
      #status {
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>WebGPU dispatch cost</h1>
    <div id="status">booting…</div>
    <script type="module">
      const status = (text) => {
        document.querySelector('#status').textContent = text;
        console.log(text);
        window.__reportProgress?.(text);
      };

      const SHADER = /* wgsl */ `
        @group(0) @binding(0) var<storage, read_write> out: array<u32>;

        @compute @workgroup_size(1)
        fn main() {
          out[0] = out[0] + 1u;
        }
      `;

      function median(values) {
        const clean = values.filter((v) => Number.isFinite(v));
        if (!clean.length) return null;
        const sorted = [...clean].sort((a, b) => a - b);
        const mid = Math.floor(sorted.length / 2);
        return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
      }

      async function setup() {
        const adapter = await navigator.gpu.requestAdapter({
          powerPreference: 'high-performance',
        });
        if (!adapter) throw new Error('no WebGPU adapter');
        const info = adapter.info ?? adapter.adapterInfo ?? null;
        const device = await adapter.requestDevice();
        const module = device.createShaderModule({ code: SHADER });
        const pipeline = device.createComputePipeline({
          layout: 'auto',
          compute: { module, entryPoint: 'main' },
        });
        const buffer = device.createBuffer({
          size: 4,
          usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST,
        });
        const bindGroupLayout = pipeline.getBindGroupLayout(0);
        const bindGroup = device.createBindGroup({
          layout: bindGroupLayout,
          entries: [{ binding: 0, resource: { buffer } }],
        });
        return { device, pipeline, bindGroup, bindGroupLayout, buffer, info };
      }

      // mode:
      //   one-pass  -> N dispatches inside a single compute pass, one submit
      //   n-pass    -> N compute passes in one encoder, one submit
      //   n-submit  -> N encoders, N submits
      function encode({ mode, count, device, pipeline, bindGroup, buffer }) {
        const t0 = performance.now();
        let submits = 0;

        if (mode === 'one-pass') {
          const enc = device.createCommandEncoder();
          const pass = enc.beginComputePass();
          pass.setPipeline(pipeline);
          pass.setBindGroup(0, bindGroup);
          for (let i = 0; i < count; i++) pass.dispatchWorkgroups(1);
          pass.end();
          device.queue.submit([enc.finish()]);
          submits = 1;
        } else if (mode === 'n-pass') {
          const enc = device.createCommandEncoder();
          for (let i = 0; i < count; i++) {
            const pass = enc.beginComputePass();
            pass.setPipeline(pipeline);
            pass.setBindGroup(0, bindGroup);
            pass.dispatchWorkgroups(1);
            pass.end();
          }
          device.queue.submit([enc.finish()]);
          submits = 1;
        } else if (mode === 'n-submit') {
          for (let i = 0; i < count; i++) {
            const enc = device.createCommandEncoder();
            const pass = enc.beginComputePass();
            pass.setPipeline(pipeline);
            pass.setBindGroup(0, bindGroup);
            pass.dispatchWorkgroups(1);
            pass.end();
            device.queue.submit([enc.finish()]);
            submits += 1;
          }
        } else if (mode === 'ort-like') {
          // ORT WebGPU's per-node shape: rebuild the bind group, push uniform
          // data, bind, dispatch — all inside the pass.
          const enc = device.createCommandEncoder();
          const pass = enc.beginComputePass();
          pass.setPipeline(pipeline);
          for (let i = 0; i < count; i++) {
            const bg = device.createBindGroup({
              layout: pipeline.getBindGroupLayout(0),
              entries: [{ binding: 0, resource: { buffer } }],
            });
            device.queue.writeBuffer(buffer, 0, new Uint32Array([i]));
            pass.setBindGroup(0, bg);
            pass.dispatchWorkgroups(1);
          }
          pass.end();
          device.queue.submit([enc.finish()]);
          submits = 1;
        } else {
          throw new Error(`unknown mode ${mode}`);
        }

        const cpuMs = performance.now() - t0;
        return { cpuMs, submits };
      }

      async function measure({ device, pipeline, bindGroup, buffer, mode, count, repeats }) {
        const samples = [];
        for (let i = 0; i < repeats; i++) {
          const encodeStart = performance.now();
          const { cpuMs, submits } = encode({
            mode,
            count,
            device,
            pipeline,
            bindGroup,
            buffer,
          });
          const submittedAt = performance.now();
          await device.queue.onSubmittedWorkDone();
          const doneAt = performance.now();
          samples.push({
            cpuMs,
            submitMs: submittedAt - encodeStart,
            wallMs: doneAt - encodeStart,
            gpuMs: doneAt - submittedAt,
            submits,
          });
        }
        const wall = median(samples.map((s) => s.wallMs));
        const cpu = median(samples.map((s) => s.cpuMs));
        const gpu = median(samples.map((s) => s.gpuMs));
        return { mode, count, samples, wallMs: wall, cpuMs: cpu, gpuMs: gpu };
      }

      async function createBindGroupCost({ device, pipeline, bindGroupLayout, buffer, repeats }) {
        // Same shape as ORT's per-kernel bind group, repeated to get its µs cost.
        const count = 1000;
        const samples = [];
        for (let r = 0; r < repeats; r++) {
          const t0 = performance.now();
          for (let i = 0; i < count; i++) {
            device.createBindGroup({
              layout: bindGroupLayout,
              entries: [{ binding: 0, resource: { buffer } }],
            });
          }
          samples.push((performance.now() - t0) / count);
        }
        return { count, usPerCall: median(samples) * 1000, samples };
      }

      window.__microbench = async ({
        counts = [0, 100, 500, 1000, 2000],
        modes = ['one-pass', 'n-pass', 'n-submit', 'ort-like'],
        repeats = 5,
      } = {}) => {
        const result = { info: null, rows: [], bindGroup: null, error: null, stack: null };
        try {
          const { device, pipeline, bindGroup, bindGroupLayout, buffer, info } = await setup();
          result.info = info
            ? {
                vendor: info.vendor,
                architecture: info.architecture,
                device: info.device,
                description: info.description,
              }
            : null;

          // Warm up compile + upload paths.
          await measure({
            device,
            pipeline,
            bindGroup,
            buffer,
            mode: 'one-pass',
            count: 10,
            repeats: 2,
          });

          for (const mode of modes) {
            for (const count of counts) {
              status(`measuring ${mode} count=${count}…`);
              result.rows.push(
                await measure({ device, pipeline, bindGroup, buffer, mode, count, repeats }),
              );
            }
          }

          result.bindGroup = await createBindGroupCost({
            device,
            pipeline,
            bindGroupLayout,
            buffer,
            repeats,
          });
        } catch (error) {
          result.error = String(error);
          result.stack = error?.stack ?? null;
        }
        status(result.error ? `error: ${result.error}` : 'done');
        return result;
      };

      window.__ready = true;
      status('ready');
    </script>
  </body>
</html>
