<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <title>browser-decode-budget GPU pass profile</title>
    <style>
      body {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        margin: 2rem;
        line-height: 1.5;
      }
      #status {
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>browser-decode-budget GPU pass profile</h1>
    <div id="status">booting…</div>
    <script type="importmap">
      {
        "imports": {
          "onnxruntime-web/webgpu": "/vendor/ort-web/ort.webgpu.bundle.min.mjs",
          "onnxruntime-common": "/vendor/ort-web/onnxruntime-common/index.js"
        }
      }
    </script>
    <script type="module">
      import { DEFAULT_TEXT, configureEnv, generate, loadModel, status } from './page-session.mjs';
      import { MAX_QUERIES, collectSegments, newEncoderRecord } from './gpu-timeline.mjs';
      import {
        interceptDevice,
        prototypesOf,
        withThrowawayDevice,
        wrapMethod,
      } from './webgpu-patch.mjs';

      configureEnv();

      // ---------------------------------------------------------------
      // Timestamp instrumentation
      // ---------------------------------------------------------------
      // Every compute pass gets a start/end timestamp written by
      // GPUComputePassEncoder.writeTimestamp(). Before the encoder is
      // finished the query set is resolved and copied into a mappable
      // buffer, so one decode token yields a per-pass GPU timeline.

      const encMeta = new WeakMap();
      const passMeta = new WeakMap();

      let ortDevice = null;
      let profileEnabled = false;
      let passSeq = 0;
      let records = [];
      let patchInfo = { pass: false, encoder: false, device: false, featureInjected: false };

      function patchFrom(device) {
        const protos = prototypesOf(device);

        patchInfo.device =
          wrapMethod(protos.device, 'createCommandEncoder', (orig) =>
            function (...args) {
              const enc = orig.apply(this, args);
              if (profileEnabled && this === ortDevice) {
                const rec = newEncoderRecord(this);
                encMeta.set(enc, rec);
                records.push(rec);
              }
              return enc;
            },
          ) || patchInfo.device;

        patchInfo.encoder =
          wrapMethod(protos.encoder, 'beginComputePass', (orig) =>
            function (...args) {
              const rec = encMeta.get(this);
              if (!rec) return orig.apply(this, args);
              if (rec.n + 2 > MAX_QUERIES) {
                rec.overflow = true;
                return orig.apply(this, args);
              }
              // Timestamps inside a pass need an experimental feature; the
              // standard path is timestampWrites on the pass descriptor.
              const slot = rec.n;
              rec.n += 2;
              const desc = { ...(args[0] ?? {}) };
              desc.timestampWrites = {
                querySet: rec.qs,
                beginningOfPassWriteIndex: slot,
                endOfPassWriteIndex: slot + 1,
              };
              const pass2 = orig.call(this, desc);
              const meta = { seq: passSeq++, slot, dispatches: 0 };
              passMeta.set(pass2, meta);
              rec.passes.push(meta);
              return pass2;
            },
          ) || patchInfo.encoder;

        patchInfo.encoder =
          wrapMethod(protos.encoder, 'finish', (orig) =>
            function (...args) {
              const rec = encMeta.get(this);
              if (rec && rec.n > 0) {
                this.resolveQuerySet(rec.qs, 0, rec.n, rec.resolveBuf, 0);
                this.copyBufferToBuffer(rec.resolveBuf, 0, rec.readBuf, 0, rec.n * 8);
              }
              return orig.apply(this, args);
            },
          ) || patchInfo.encoder;

        patchInfo.pass =
          wrapMethod(protos.pass, 'dispatchWorkgroups', (orig) =>
            function (...args) {
              const meta = passMeta.get(this);
              if (meta) meta.dispatches += 1;
              return orig.apply(this, args);
            },
          ) || patchInfo.pass;

        patchInfo.pass =
          wrapMethod(protos.pass, 'dispatchWorkgroupsIndirect', (orig) =>
            function (...args) {
              const meta = passMeta.get(this);
              if (meta) meta.dispatches += 1;
              return orig.apply(this, args);
            },
          ) || patchInfo.pass;
      }

      // Intercept the adapter/device ORT uses: inject timestamp-query and
      // patch the prototype objects as soon as the device exists.
      interceptDevice({
        onDevice: (device) => {
          ortDevice = device;
          patchFrom(device);
        },
        extendDescriptor: (desc, adapter) => {
          if (!adapter.features?.has?.('timestamp-query')) return desc;
          const required = new Set(desc.requiredFeatures ?? []);
          required.add('timestamp-query');
          patchInfo.featureInjected = true;
          return { ...desc, requiredFeatures: [...required] };
        },
      });

      async function ensurePatched() {
        if (ortDevice) return true;
        // The throwaway device is destroyed after patching; it must never be
        // claimed as the ORT device. Only interceptDevice's onDevice does that.
        return withThrowawayDevice(patchFrom);
      }

      function summarizeStep(segments, step) {
        if (!segments.length) return null;
        const us = segments.map((s) => s.us).sort((a, b) => a - b);
        const sumUs = us.reduce((a, b) => a + b, 0);
        const start = Math.min(...segments.map((s) => s.startNs));
        const end = Math.max(...segments.map((s) => s.endNs));
        const spanUs = (end - start) / 1000;
        const pct = (p) => us[Math.min(us.length - 1, Math.floor(p * us.length))];
        return {
          step,
          passes: segments.length,
          totalDispatches: segments.reduce((a, s) => a + s.dispatches, 0),
          sumUs,
          spanUs,
          coverage: spanUs ? sumUs / spanUs : null,
          medianUs: pct(0.5),
          p90Us: pct(0.9),
          maxUs: us[us.length - 1],
          overflowEncoders: segments.overflowEncoders ?? 0,
          segments: segments.map((s) => ({
            seq: s.seq,
            us: Number(s.us.toFixed(3)),
            dispatches: s.dispatches,
          })),
        };
      }

      async function profile({
        model = 'base',
        text = DEFAULT_TEXT,
        profileTokens = 4,
      } = {}) {
        const result = {
          userAgent: navigator.userAgent,
          hasWebGpu: 'gpu' in navigator,
          model,
          patchInfo: null,
          loadMs: null,
          runs: [],
          error: null,
          stack: null,
        };

        try {
          const ok = await ensurePatched();
          if (!ok) throw new Error('WebGPU unavailable: no adapter');
          result.patchInfo = { ...patchInfo };

          const loaded = await loadModel(model);
          result.loadMs = loaded.loadMs;

          status(`warmup ${model}…`);
          profileEnabled = false;
          await generate(loaded.pipe, 2, text);

          // Profile decode only: profiling switches on after the first token,
          // so prefill never reaches the encoder wrapper.
          records = [];
          passSeq = 0;
          const stepMarks = [];
          profileEnabled = false;
          status(`profiling ${model}: ${profileTokens} decode steps…`);
          const tokenTimes = [];
          const run = await generate(loaded.pipe, profileTokens + 1, text, (tokenIndex) => {
            if (tokenIndex >= 1) profileEnabled = true;
            stepMarks.push(passSeq);
            tokenTimes.push(performance.now());
          });
          profileEnabled = false;

          const segments = await collectSegments(records, ortDevice);
          result.wallMs = run.totalMs;
          result.tokens = run.tokens;
          result.stepMarks = stepMarks;

          // stepMarks[k] is the number of passes recorded when token k+1 was
          // emitted, so step k spans [stepMarks[k], stepMarks[k + 1]).
          const overflowEncoders = segments.overflowEncoders ?? 0;
          for (let k = 0; k + 1 < stepMarks.length; k++) {
            const from = stepMarks[k];
            const to = stepMarks[k + 1];
            const slice = segments.filter((s) => s.seq >= from && s.seq < to);
            const summary = summarizeStep(slice, k);
            if (summary) {
              // Wall time between consecutive token callbacks: an independent
              // check on the timestamp unit and on profiling overhead.
              if (tokenTimes[k] != null && tokenTimes[k + 1] != null) {
                summary.stepWallMs = tokenTimes[k + 1] - tokenTimes[k];
              }
              // Attach it after filtering: a slice is a new array and would
              // otherwise lose the property set on the full segment list.
              summary.overflowEncoders = overflowEncoders;
              result.runs.push(summary);
            }
          }

          result.patchInfo = { ...patchInfo };
        } catch (error) {
          result.error = String(error);
          result.stack = error?.stack ?? null;
        }

        profileEnabled = false;
        status(result.error ? `error: ${result.error}` : 'done');
        return result;
      }

      window.__profile = profile;
      window.__ready = true;
      status('ready');
    </script>
  </body>
</html>
