    <style>
      body {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;

  <body>
    <h1>browser-decode-budget op attribution</h1>
    <div id="status">booting…</div>
    <script type="importmap">
      {
        "imports": {
          "onnxruntime-web/webgpu": "/vendor/ort-web/ort.webgpu.bundle.min.mjs",
          "onnxruntime-common": "/vendor/ort-web/onnxruntime-common/index.js"
        }
      }
    </script>
    <script type="module">
      // Gate 7: attribute each compute pass to the kernel that issued it.
      //
      // ORT's WebGPU EP is compiled into wasm; the JS boundary still receives
      // a descriptor for every shader module and pipeline. Those descriptors
      // carry a label from the C++ side, so a pipeline created with
      // label:"MatMulNBits" is identifiable without touching ORT internals.
      // We record the label (and a shader-code hash as a fallback) at creation
      // and attach it to each pass through setPipeline.
      import { DEFAULT_TEXT, configureEnv, generate, loadModel, status } from './page-session.mjs';
      import { MAX_QUERIES, collectSegments, newEncoderRecord } from './gpu-timeline.mjs';
      import {
        interceptDevice,
        prototypesOf,
        withThrowawayDevice,
        wrapMethod,
      } from './webgpu-patch.mjs';

      configureEnv();

      // Four profiled steps are 4,448 dispatches; the cap leaves room for
      // longer runs without letting the log grow without bound.
      const MAX_DISPATCH_LOG = 20000;

      let ortDevice = null;
      let profileEnabled = false;
      let passSeq = 0;
      let records = [];
      let dispatchLog = [];
      let uniformWriteCount = 0;
      let uniformWriteBuffers = new Set();
      let patchInfo = {
        pass: false,
        encoder: false,
        device: false,
        shader: false,
        pipeline: false,
        bindGroup: false,
        queueWrite: false,
        featureInjected: false,
      };

      // Creation-time metadata. Pipelines are reused across steps, so these
      // maps must live for the whole session, not per profile step.
      const modules = new WeakMap(); // GPUShaderModule -> { label, hash, codeLength, workgroupSize }
      const pipelines = new WeakMap(); // GPUComputePipeline -> { label, module, key }
      const identityDetails = new Map(); // key -> what the descriptor revealed
      const bindGroupSizes = new WeakMap(); // GPUBindGroup -> buffer sizes it binds
      const bindGroupRefs = new WeakMap(); // GPUBindGroup -> the buffers it binds
      const lastUniformWrite = new WeakMap(); // GPUBuffer -> most recent queue.writeBuffer

      let nextModuleId = 0;
      let nextPipelineId = 0;

      const encMeta = new WeakMap();

      function fnv1a(text) {
        let hash = 0x811c9dc5;
        for (let i = 0; i < text.length; i++) {
          hash ^= text.charCodeAt(i);
          hash = Math.imul(hash, 0x01000193) >>> 0;
        }
        return hash.toString(16).padStart(8, '0');
      }

      function pipelineKey(meta) {
        return meta?.key ?? 'unlabeled';
      }

      // Gate 9 needs the launched workgroup count and the workgroup's size to
      // turn a dispatch into an occupancy proxy. The size is a literal in the
      // shader source ORT compiles, so read it where the code is visible.
      function parseWorkgroupSize(code) {
        const literal =
          /@workgroup_size\s*\(\s*(\d+)(?:\s*,\s*(\d+))?(?:\s*,\s*(\d+))?\s*\)/.exec(code);
        if (literal) {
          return [Number(literal[1]), Number(literal[2] ?? 1), Number(literal[3] ?? 1)];
        }

        // ORT emits `@workgroup_size(workgroup_size_x, …)` and declares the
        // three values as u32 constants. Resolve those names instead of
        // guessing a default size.
        const named =
          /@workgroup_size\s*\(\s*([A-Za-z_]\w*)\s*,\s*([A-Za-z_]\w*)\s*,\s*([A-Za-z_]\w*)\s*\)/.exec(
            code,
          );
        if (!named) return null;
        const valueOf = (name) => {
          const declaration = new RegExp(
            `(?:const\\s+)?${name}\\s*:\\s*u32\\s*=\\s*(\\d+)`,
          ).exec(code);
          return declaration ? Number(declaration[1]) : null;
        };
        const values = [valueOf(named[1]), valueOf(named[2]), valueOf(named[3])];
        return values.every((value) => value != null) ? values : null;
      }

      // writeTimestamp() inside a pass needs an experimental feature this
      // Chrome does not expose. The exact alternative is one pass per
      // dispatch: a pass boundary timestamp then IS the dispatch timestamp.
      // ORT sees a normal encoder; the wrapper ends and reopens a pass after
      // each dispatch and replays the pipeline and bind groups, which is all
      // a pass boundary requires.
      function splitPass(encoder, desc, rec, begin) {
        const state = {
          pipeline: null,
          pipelineKey: 'unlabeled',
          bindGroups: new Map(),
          pipelines: [],
          dispatches: 0,
          workgroups: null,
        };
        let inner = null;
        let slot = null;

        const ensure = () => {
          if (inner) return inner;
          if (rec.n + 2 > MAX_QUERIES) {
            rec.overflow = true;
            slot = null;
            inner = begin.call(encoder, { ...desc });
            return inner;
          }
          slot = rec.n;
          rec.n += 2;
          inner = begin.call(encoder, {
            ...desc,
            timestampWrites: {
              querySet: rec.qs,
              beginningOfPassWriteIndex: slot,
              endOfPassWriteIndex: slot + 1,
            },
          });
          if (state.pipeline) inner.setPipeline(state.pipeline);
          for (const [index, entry] of state.bindGroups) {
            if (entry.offsets.length) {
              inner.setBindGroup(index, entry.group, ...entry.offsets);
            } else {
              inner.setBindGroup(index, entry.group);
            }
          }
          return inner;
        };

        const flush = () => {
          if (!inner) return;
          inner.end();
          if (state.dispatches > 0 && state.pipeline) {
            // Flatten the sizes of the bind groups bound at this moment. The
            // Map replaces an index on rebind, so a replayed group is not
            // counted twice, while distinct groups keep their multiplicity.
            const bound = [...state.bindGroups.entries()];
            const buffers = [];
            const refs = new Set();
            for (const [, { group }] of bound) {
              buffers.push(...(bindGroupSizes.get(group) ?? []));
              for (const buffer of bindGroupRefs.get(group) ?? []) refs.add(buffer);
            }
            const workgroupSize = pipelines.get(state.pipeline)?.workgroupSize ?? null;

            // Gate 9 replay needs the exact objects, not just their sizes, so
            // it can submit the same dispatch again outside ORT's encoder.
            if (dispatchLog.length < MAX_DISPATCH_LOG) {
              dispatchLog.push({
                key: state.pipelineKey,
                pipeline: state.pipeline,
                bindGroups: bound.map(([index, { group, offsets }]) => ({
                  index,
                  group,
                  offsets,
                })),
                workgroups: state.workgroups,
                workgroupSize,
                buffers,
                refs: [...refs],
              });
            }

            if (slot != null) {
              rec.passes.push({
                seq: passSeq++,
                slot,
                dispatches: state.dispatches,
                pipelines: [...new Set(state.pipelines)],
                buffers,
                workgroups: state.workgroups,
                workgroupSize,
              });
            }
          }
          inner = null;
          slot = null;
          state.dispatches = 0;
          state.pipelines = [];
          state.workgroups = null;
        };

        return {
          setPipeline(pipeline) {
            state.pipeline = pipeline;
            state.pipelineKey = pipelineKey(pipelines.get(pipeline));
            state.pipelines.push(state.pipelineKey);
            ensure().setPipeline(pipeline);
          },
          setBindGroup(index, group, ...offsets) {
            state.bindGroups.set(index, { group, offsets });
            ensure().setBindGroup(index, group, ...offsets);
          },
          dispatchWorkgroups(x = 1, y = 1, z = 1) {
            ensure().dispatchWorkgroups(x, y, z);
            state.workgroups = [x, y, z];
            state.dispatches += 1;
            flush();
          },
          dispatchWorkgroupsIndirect(...args) {
            ensure().dispatchWorkgroupsIndirect(...args);
            // The indirect buffer is not read back; a null count stays visible
            // as missing workgroup data instead of being guessed.
            state.workgroups = null;
            state.dispatches += 1;
            flush();
          },
          end() {
            flush();
          },
          pushDebugGroup(label) {
            ensure().pushDebugGroup(label);
          },
          popDebugGroup() {
            ensure().popDebugGroup();
          },
          insertDebugMarker(label) {
            ensure().insertDebugMarker?.(label);
          },
        };
      }

      function patchFrom(device) {
        const protos = prototypesOf(device);

        patchInfo.device =
          wrapMethod(protos.device, 'createCommandEncoder', (orig) =>
            function (...args) {
              const enc = orig.apply(this, args);
              if (profileEnabled && this === ortDevice) {
                const rec = newEncoderRecord(this);
                encMeta.set(enc, rec);
                records.push(rec);
              }
              return enc;
            },
          ) || patchInfo.device;

        // --- creation-time identity ------------------------------------
        // Gate 8 needs the weight bytes a dispatch reads. ORT binds them as
        // storage buffers, so the bind group is where the size is visible.
        patchInfo.bindGroup =
          wrapMethod(protos.device, 'createBindGroup', (orig) =>
            function (desc) {
              const group = orig.call(this, desc);
              const sizes = [];
              const refs = new Set();
              for (const entry of desc?.entries ?? []) {
                const resource = entry?.resource;
                const buffer = resource?.buffer;
                if (buffer) {
                  sizes.push(resource.size ?? buffer.size);
                  refs.add(buffer);
                }
              }
              bindGroupSizes.set(group, sizes);
              bindGroupRefs.set(group, [...refs]);
              return group;
            },
          ) || patchInfo.bindGroup;

        // Gate 9 replays a recorded dispatch after the model has stopped
        // generating. ORT writes each node's shape uniform with writeBuffer
        // once per token, so keeping the last write lets the replay restore
        // the small per-node buffers before timing. Counting distinct buffers
        // also exposes whether uniforms are per-node or shared.
        patchInfo.queueWrite =
          wrapMethod(protos.queue, 'writeBuffer', (orig) =>
            function (buffer, offset, ...rest) {
              if (profileEnabled && this === ortDevice?.queue) {
                const data = rest[0];
                if (ArrayBuffer.isView(data) || data instanceof ArrayBuffer) {
                  const bytes = ArrayBuffer.isView(data)
                    ? new Uint8Array(data.buffer, data.byteOffset, data.byteLength).slice()
                    : new Uint8Array(data.slice(0));
                  lastUniformWrite.set(buffer, { offset, data: bytes });
                  uniformWriteCount += 1;
                  uniformWriteBuffers.add(buffer);
                }
              }
              return orig.call(this, buffer, offset, ...rest);
            },
          ) || patchInfo.queueWrite;

        patchInfo.shader =
          wrapMethod(protos.device, 'createShaderModule', (orig) =>
            function (desc) {
              const module = orig.call(this, desc);
              const code = typeof desc?.code === 'string' ? desc.code : '';
              modules.set(module, {
                id: nextModuleId++,
                label: desc?.label ?? '',
                hash: code ? fnv1a(code) : '',
                codeLength: code.length,
                workgroupSize: parseWorkgroupSize(code),
                preview: code.slice(0, 240).replace(/\s+/g, ' '),
              });
              return module;
            },
          ) || patchInfo.shader;

        const recordPipeline = (pipeline, desc) => {
          const moduleMeta = desc?.compute?.module ? modules.get(desc.compute.module) : null;
          const entryPoint = desc?.compute?.entryPoint ?? '';
          const label = desc?.label ?? '';
          // The pipeline label is usually empty; the shader module label is
          // the op name ORT compiled ("MatMulNBits", "LayerNorm", ...). Prefer
          // it, and fall back to the shader hash only when both are absent.
          const key = label
            ? `label:${label}`
            : moduleMeta?.label
              ? `op:${moduleMeta.label}`
              : moduleMeta?.hash
                ? `shader:${moduleMeta.hash}:${entryPoint}`
                : `pipeline:${nextPipelineId}`;
          pipelines.set(pipeline, {
            id: nextPipelineId++,
            label,
            entryPoint,
            module: moduleMeta ?? null,
            workgroupSize: moduleMeta?.workgroupSize ?? null,
            key,
          });
          if (!identityDetails.has(key)) {
            identityDetails.set(key, {
              key,
              label,
              entryPoint,
              moduleLabel: moduleMeta?.label ?? '',
              codeLength: moduleMeta?.codeLength ?? 0,
              preview: moduleMeta?.preview ?? '',
              pipelines: 0,
              hashes: [],
            });
          }
          const detail = identityDetails.get(key);
          detail.pipelines += 1;
          if (moduleMeta?.hash && !detail.hashes.includes(moduleMeta.hash)) {
            detail.hashes.push(moduleMeta.hash);
          }
          return pipeline;
        };

        patchInfo.pipeline =
          wrapMethod(protos.device, 'createComputePipeline', (orig) =>
            function (desc) {
              return recordPipeline(orig.call(this, desc), desc);
            },
          ) || patchInfo.pipeline;

        patchInfo.pipeline =
          wrapMethod(protos.device, 'createComputePipelineAsync', (orig) =>
            function (desc) {
              return orig.call(this, desc).then((pipeline) => recordPipeline(pipeline, desc));
            },
          ) || patchInfo.pipeline;

        // --- one pass per dispatch -------------------------------------
        patchInfo.encoder =
          wrapMethod(protos.encoder, 'beginComputePass', (orig) =>
            function (desc = {}) {
              const rec = encMeta.get(this);
              if (!rec) return orig.apply(this, arguments);
              return splitPass(this, desc, rec, orig);
            },
          ) || patchInfo.encoder;

        patchInfo.encoder =
          wrapMethod(protos.encoder, 'finish', (orig) =>
            function (...args) {
              const rec = encMeta.get(this);
              if (rec && rec.n > 0) {
                this.resolveQuerySet(rec.qs, 0, rec.n, rec.resolveBuf, 0);
                this.copyBufferToBuffer(rec.resolveBuf, 0, rec.readBuf, 0, rec.n * 8);
              }
              return orig.apply(this, args);
            },
          ) || patchInfo.encoder;

        // splitPass implements the pass surface ORT uses; these checks only
        // prove the original methods exist to be mirrored.
        patchInfo.pass = [
          'setPipeline',
          'setBindGroup',
          'dispatchWorkgroups',
          'dispatchWorkgroupsIndirect',
        ].every((name) => typeof protos.pass?.[name] === 'function');
      }

      interceptDevice({
        onDevice: (device) => {
          ortDevice = device;
          patchFrom(device);
        },
        extendDescriptor: (desc, adapter) => {
          if (!adapter.features?.has?.('timestamp-query')) return desc;
          const required = new Set(desc.requiredFeatures ?? []);
          required.add('timestamp-query');
          patchInfo.featureInjected = true;
          return { ...desc, requiredFeatures: [...required] };
        },
      });

      async function ensurePatched() {
        if (ortDevice) return true;
        return withThrowawayDevice(patchFrom);
      }

      function summarizeStep(segments, step) {
        if (!segments.length) return null;
        const sumUs = segments.reduce((sum, segment) => sum + segment.us, 0);
        const start = Math.min(...segments.map((segment) => segment.startNs));
        const end = Math.max(...segments.map((segment) => segment.endNs));
        const spanUs = (end - start) / 1000;
        return {
          step,
          passes: segments.length,
          totalDispatches: segments.reduce((sum, segment) => sum + segment.dispatches, 0),
          sumUs,
          spanUs,
          coverage: spanUs ? sumUs / spanUs : null,
          overflowEncoders: segments.overflowEncoders ?? 0,
          segments: segments.map((segment) => ({
            seq: segment.seq,
            us: Number(segment.us.toFixed(3)),
            dispatches: segment.dispatches,
            pipelines: segment.pipelines,
            buffers: segment.buffers,
            workgroups: segment.workgroups ?? null,
            workgroupSize: segment.workgroupSize ?? null,
          })),
        };
      }

      async function attribute({
        model = 'base',
        text = DEFAULT_TEXT,
        profileTokens = 4,
      } = {}) {
        const result = {
          userAgent: navigator.userAgent,
          hasWebGpu: 'gpu' in navigator,
          model,
          patchInfo: null,
          loadMs: null,
          runs: [],
          pipelineCount: 0,
          shaderCount: 0,
          error: null,
          stack: null,
        };

        try {
          const ok = await ensurePatched();
          if (!ok) throw new Error('WebGPU unavailable: no adapter');

          const loaded = await loadModel(model);
          result.loadMs = loaded.loadMs;

          status(`warmup ${model}…`);
          profileEnabled = false;
          await generate(loaded.pipe, 2, text);

          records = [];
          dispatchLog = [];
          uniformWriteCount = 0;
          uniformWriteBuffers = new Set();
          passSeq = 0;
          const stepMarks = [];
          const tokenTimes = [];
          status(`attributing ${model}: ${profileTokens} decode steps…`);
          const run = await generate(loaded.pipe, profileTokens + 1, text, (tokenIndex) => {
            if (tokenIndex >= 1) profileEnabled = true;
            stepMarks.push(passSeq);
            tokenTimes.push(performance.now());
          });
          profileEnabled = false;

          const segments = await collectSegments(records, ortDevice);
          result.wallMs = run.totalMs;
          result.tokens = run.tokens;

          const overflowEncoders = segments.overflowEncoders ?? 0;
          for (let k = 0; k + 1 < stepMarks.length; k++) {
            const from = stepMarks[k];
            const to = stepMarks[k + 1];
            const slice = segments.filter((segment) => segment.seq >= from && segment.seq < to);
            const summary = summarizeStep(slice, k);
            if (summary) {
              if (tokenTimes[k] != null && tokenTimes[k + 1] != null) {
                summary.stepWallMs = tokenTimes[k + 1] - tokenTimes[k];
              }
              // Attach it after filtering: a slice is a new array and would
              // otherwise lose the property set on the full segment list.
              summary.overflowEncoders = overflowEncoders;
              result.runs.push(summary);
            }
          }

          // Distinct identities seen, so an empty label space is visible.
          const seenPipelines = new Set();
          for (const segment of segments) {
            for (const key of segment.pipelines) seenPipelines.add(key);
          }
          result.pipelineCount = seenPipelines.size;
          result.patchInfo = { ...patchInfo };
          result.identities = [...seenPipelines].sort();
          result.identityDetails = Object.fromEntries(identityDetails);
          result.dispatchLogged = dispatchLog.length;
          result.uniformWrites = {
            calls: uniformWriteCount,
            distinctBuffers: uniformWriteBuffers.size,
          };
        } catch (error) {
          result.error = String(error);
          result.stack = error?.stack ?? null;
        }

        profileEnabled = false;
        status(result.error ? `error: ${result.error}` : 'done');
        return result;
      }

      // --- Gate 9: replay one recorded dispatch in two encodings ----------
      //
      // Gate 7/8 had to give every dispatch its own pass to get a timestamp.
      // That removes the overlap a shared pass allows and adds one pass
      // boundary per dispatch, so the per-dispatch numbers need a correction.
      //
      // Replaying the same recorded dispatch N times (a) inside one pass and
      // (b) in N passes measures the encoding cost on the real pipeline and
      // the real buffers. Consecutive repeats write the same output buffer,
      // so WebGPU's ordering serializes them just like a dependent chain; the
      // measurement is not flattered by accidental overlap. The weight stays
      // hot across repeats, which biases against the small-kernel hypothesis:
      // if a hot 0.22 MiB weight is still slow, the cache is not the answer.

      function median(values) {
        const clean = values.filter((value) => Number.isFinite(value)).sort((a, b) => a - b);
        if (!clean.length) return null;
        const middle = Math.floor(clean.length / 2);
        return clean.length % 2 ? clean[middle] : (clean[middle - 1] + clean[middle]) / 2;
      }

      function makeTimer(device) {
        // The query set, resolve buffer and read buffer are the same trio the
        // attribution run uses; keep them defined in one place.
        return newEncoderRecord(device);
      }

      async function readTimer(device, timer, count) {
        await timer.readBuf.mapAsync(GPUMapMode.READ, 0, count * 8);
        const view = new BigInt64Array(timer.readBuf.getMappedRange(0, count * 8));
        const values = [];
        for (let i = 0; i + 1 < count; i += 2) {
          values.push(Number(view[i + 1] - view[i]) / 1000);
        }
        timer.readBuf.unmap();
        return values;
      }

      function bindSample(pass, sample) {
        pass.setPipeline(sample.pipeline);
        for (const { index, group, offsets } of sample.bindGroups) {
          if (offsets.length) pass.setBindGroup(index, group, ...offsets);
          else pass.setBindGroup(index, group);
        }
      }

      async function timeBatched(device, timer, sample, count) {
        const enc = device.createCommandEncoder();
        const pass = enc.beginComputePass({
          timestampWrites: {
            querySet: timer.qs,
            beginningOfPassWriteIndex: 0,
            endOfPassWriteIndex: 1,
          },
        });
        bindSample(pass, sample);
        for (let i = 0; i < count; i += 1) {
          pass.dispatchWorkgroups(...sample.workgroups);
        }
        pass.end();
        enc.resolveQuerySet(timer.qs, 0, 2, timer.resolveBuf, 0);
        enc.copyBufferToBuffer(timer.resolveBuf, 0, timer.readBuf, 0, 16);
        device.queue.submit([enc.finish()]);
        const [us] = await readTimer(device, timer, 2);
        return us;
      }

      async function timeSplit(device, timer, sample, count) {
        const enc = device.createCommandEncoder();
        for (let i = 0; i < count; i += 1) {
          const pass = enc.beginComputePass({
            timestampWrites: {
              querySet: timer.qs,
              beginningOfPassWriteIndex: i * 2,
              endOfPassWriteIndex: i * 2 + 1,
            },
          });
          bindSample(pass, sample);
          pass.dispatchWorkgroups(...sample.workgroups);
          pass.end();
        }
        enc.resolveQuerySet(timer.qs, 0, count * 2, timer.resolveBuf, 0);
        enc.copyBufferToBuffer(timer.resolveBuf, 0, timer.readBuf, 0, count * 16);
        device.queue.submit([enc.finish()]);
        const passUs = await readTimer(device, timer, count * 2);
        return {
          totalUs: passUs.reduce((sum, us) => sum + us, 0),
        };
      }

      async function replayKernels({
        opKey = 'op:MatMulNBits',
        counts = [1, 4, 16, 64],
        repeats = 7,
      } = {}) {
        const result = {
          opKey,
          counts,
          repeats,
          classes: [],
          skipped: 0,
          uniformWrites: {
            calls: uniformWriteCount,
            distinctBuffers: uniformWriteBuffers.size,
            restored: 0,
          },
          error: null,
          stack: null,
        };

        try {
          const device = ortDevice;
          if (!device) throw new Error('replay: no ORT device');
          if (!dispatchLog.length) {
            throw new Error('replay: no dispatch log; run attribution first');
          }
          const usableCounts = counts.filter(
            (count) => Number.isInteger(count) && count >= 1 && count * 2 <= MAX_QUERIES,
          );
          if (usableCounts.length < 2) {
            throw new Error('replay: need two counts that fit the query set');
          }

          const groups = new Map();
          for (const entry of dispatchLog) {
            if (entry.key !== opKey || !entry.pipeline) continue;
            if (!Array.isArray(entry.workgroups)) {
              result.skipped += 1;
              continue;
            }
            const buffers = [...entry.buffers].sort((a, b) => a - b);
            // Byte size alone is not one kernel: the graph can hold two
            // shapes with the same initializer bytes (e.g. k_proj [256,48,16]
            // and per-layer projection [1536,8,16]). The launched workgroup
            // count separates them at runtime.
            const workgroups = entry.workgroups
              .map((value) => value ?? 1)
              .join('x');
            const signature = `${buffers.join(',')}|${workgroups}`;
            let group = groups.get(signature);
            if (!group) {
              group = {
                signature,
                buffers,
                refs: entry.refs ?? [],
                sample: entry,
                dispatches: 0,
              };
              groups.set(signature, group);
            }
            group.dispatches += 1;
          }
          if (!groups.size) throw new Error('replay: no replayable dispatches');

          const timer = makeTimer(device);
          const largest = [...groups.values()].sort(
            (a, b) => Math.max(...b.buffers) - Math.max(...a.buffers),
          )[0];

          // Steady clock before any sample is recorded; discarded.
          const warmCount = Math.min(8, usableCounts[usableCounts.length - 1]);
          const warmUntil = performance.now() + 600;
          while (performance.now() < warmUntil) {
            await timeBatched(device, timer, largest.sample, warmCount);
          }

          for (const group of groups.values()) {
            // Restore the last small write per node. Weight uploads happen at
            // load time and are deliberately not repeated.
            for (const buffer of group.refs) {
              const write = lastUniformWrite.get(buffer);
              if (write && buffer.size <= 4096 && write.data.byteLength <= 4096) {
                device.queue.writeBuffer(buffer, write.offset, write.data);
                result.uniformWrites.restored += 1;
              }
            }
            await device.queue.onSubmittedWorkDone();

            const batched = [];
            const split = [];
            for (let repeat = 0; repeat < repeats; repeat += 1) {
              const order = repeat % 2 === 0 ? usableCounts : [...usableCounts].reverse();
              const splitFirst = repeat % 2 === 1;
              for (const count of order) {
                const runBatched = async () => {
                  const us = await timeBatched(device, timer, group.sample, count);
                  batched.push({ count, repeat, us });
                };
                const runSplit = async () => {
                  const measured = await timeSplit(device, timer, group.sample, count);
                  split.push({ count, repeat, us: measured.totalUs });
                };
                if (splitFirst) {
                  await runSplit();
                  await runBatched();
                } else {
                  await runBatched();
                  await runSplit();
                }
              }
            }

            const summarize = (samples) =>
              usableCounts.map((count) => {
                const values = samples
                  .filter((sample) => sample.count === count)
                  .map((sample) => sample.us);
                return {
                  count,
                  medianUs: median(values),
                  minUs: values.length ? Math.min(...values) : null,
                  samples: values,
                };
              });

            result.classes.push({
              signature: group.signature,
              buffers: group.buffers,
              workgroups: group.sample.workgroups,
              workgroupSize: group.sample.workgroupSize,
              dispatches: group.dispatches,
              batched: summarize(batched),
              split: summarize(split),
            });
          }

          timer.qs.destroy?.();
          timer.resolveBuf.destroy();
          timer.readBuf.destroy();
        } catch (error) {
          result.error = String(error);
          result.stack = error?.stack ?? null;
        }

        status(result.error ? `error: ${result.error}` : 'done');
        return result;
      }

      async function gate9({
        model = 'base',
        text = DEFAULT_TEXT,
        profileTokens = 4,
        replay = {},
      } = {}) {
        const attribution = await attribute({ model, text, profileTokens });
        let replayResult = { classes: [], error: 'attribution failed' };
        if (!attribution.error) {
          status(`replaying recorded ${replay.opKey ?? 'MatMulNBits'} dispatches…`);
          replayResult = await replayKernels(replay);
        }
        return { attribution, replay: replayResult };
      }

      window.__attribute = attribute;
      window.__gate9 = gate9;
      window.__ready = true;
      status('ready');
    </script>
  </body>
