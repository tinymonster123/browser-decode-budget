<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <title>fused-onnx Gate 3 bench</title>
    <style>
      body {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        margin: 2rem;
        line-height: 1.5;
      }
      #status {
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>fused-onnx Gate 3</h1>
    <div id="status">booting…</div>
    <script type="importmap">
      {
        "imports": {
          "onnxruntime-web/webgpu": "/vendor/ort-web/ort.webgpu.bundle.min.mjs",
          "onnxruntime-common": "/vendor/ort-web/onnxruntime-common/index.js"
        }
      }
    </script>
    <script type="module">
      import {
        DEFAULT_TEXT,
        configureEnv,
        generate,
        generatedText,
        loadModel,
        status,
      } from './page-session.mjs';

      configureEnv();

      function bigramSimilarity(a, b) {
        const grams = (value) => {
          const text = value.replace(/\s+/g, '');
          const set = new Set();
          for (let i = 0; i < text.length - 1; i++) set.add(text.slice(i, i + 2));
          return set;
        };
        const left = grams(a);
        const right = grams(b);
        const common = [...left].filter((gram) => right.has(gram)).length;
        const union = left.size + right.size - common;
        return {
          jaccard: union ? common / union : 1,
          common,
          aSize: left.size,
          bSize: right.size,
        };
      }

      async function run(pipe, maxNewTokens, text) {
        const times = [];
        const { out, totalMs, tokens, startedAt } = await generate(
          pipe,
          maxNewTokens,
          text,
          () => times.push(performance.now()),
        );
        return {
          ms: Math.round(totalMs),
          tokens,
          firstTokenMs: times.length ? Math.round(times[0] - startedAt) : null,
          lastTokenMs: times.length ? Math.round(times.at(-1) - startedAt) : null,
          text: generatedText(out),
        };
      }

      async function bench({
        repeats = 4,
        maxNewTokens = 64,
        text = DEFAULT_TEXT,
        aModel = 'base',
        aName = 'base',
        bModel = 'gate2',
        bName = 'gate2',
      } = {}) {
        const result = {
          userAgent: navigator.userAgent,
          hasWebGpu: 'gpu' in navigator,
          load: {},
          equivalence: null,
          rounds: [],
        };

        try {
          const a = await loadModel(aModel);
          result.load[aName] = a.loadMs;
          const b = await loadModel(bModel);
          result.load[bName] = b.loadMs;

          const sessions = a.pipe?.model?.sessions ?? {};
          const first = Object.values(sessions)[0];
          result.device = first
            ? {
                sessionKeys: Object.keys(first),
                config: first.config ?? null,
                sessionOptions: first.sessionOptions ?? null,
                handlerKeys: first.handler ? Object.keys(first.handler) : [],
              }
            : null;

          status('warmup…');
          await run(a.pipe, 1, text);
          await run(b.pipe, 1, text);

          status('equivalence…');
          const eqA = await run(a.pipe, maxNewTokens, text);
          const eqB = await run(b.pipe, maxNewTokens, text);
          result.equivalence = {
            exact: eqA.text === eqB.text,
            aText: eqA.text,
            bText: eqB.text,
            aName,
            bName,
            aTokens: eqA.tokens,
            bTokens: eqB.tokens,
            similarity: bigramSimilarity(eqA.text, eqB.text),
          };

          for (let round = 0; round < repeats; round++) {
            const order =
              round % 2 === 0
                ? [
                    [aName, a],
                    [bName, b],
                  ]
                : [
                    [bName, b],
                    [aName, a],
                  ];
            for (const [name, model] of order) {
              status(`round ${round + 1}/${repeats}: ${name}`);
              const measured = await run(model.pipe, maxNewTokens, text);
              result.rounds.push({ round, name, ...measured });
            }
          }
        } catch (error) {
          result.error = String(error);
          result.stack = error?.stack ?? null;
        }

        status(result.error ? `error: ${result.error}` : 'done');
        return result;
      }

      window.__bench = bench;
      window.__ready = true;
      status('ready');
    </script>
  </body>
</html>
